name: TCC EBAC QE – CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Permite execução manual

jobs:
  # ─── Testes de API ─────────────────────────────────────────────────────────
  api-tests:
    name: 🔌 Testes de API (Supertest + Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: API/package.json

      - name: Instalar dependências
        working-directory: ./API
        run: npm install

      - name: Executar testes de API
        working-directory: ./API
        run: npm run test:report

      - name: Upload do relatório de API
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: API/api-report.json

  # ─── Testes de UI ──────────────────────────────────────────────────────────
  ui-tests:
    name: 🌐 Testes de UI (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: UI/package.json

      - name: Instalar dependências
        working-directory: ./UI
        run: npm install

      - name: Instalar browsers do Playwright
        working-directory: ./UI
        run: npx playwright install --with-deps chromium

      - name: Executar testes de UI
        working-directory: ./UI
        run: npm test

      - name: Upload do relatório HTML do Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: UI/playwright-report/
          retention-days: 30

  # ─── Testes de Performance ─────────────────────────────────────────────────
  performance-tests:
    name: ⚡ Testes de Performance (K6)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Criar pasta de relatórios
        run: mkdir -p Performance/reports

      - name: Executar teste de performance – Login
        run: k6 run Performance/login.k6.js

      - name: Executar teste de performance – API Cupons
        run: k6 run Performance/coupons.k6.js

      - name: Upload dos relatórios de performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: Performance/reports/
